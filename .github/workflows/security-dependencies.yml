name: Security dependency refresh
on:
  push:
    branches: [security/dependency-updates]
    paths:
      - '.github/workflows/security-dependencies.yml'
      - 'scripts/update-go-dependencies.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve, test and build
        run: bash scripts/update-go-dependencies.sh
      - name: Upload resolved dependencies and binary
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: |
            go.mod
            go.sum
            /tmp/helm-docs-security
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          govulncheck -mode=binary /tmp/helm-docs-security
